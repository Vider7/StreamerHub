<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>queue overlay</title>
<style>
  @property --accent { syntax: "<color>"; inherits: true; initial-value: #ff9f1c; }
  :root {
    --accent: #ff9f1c;
    --txt: #f2f0f5;
    --dim: #8e8898;
    --hair: rgba(255, 255, 255, 0.08);
  }
  :root.rgb { animation: accent-cycle 24s linear infinite; }
  @keyframes accent-cycle {
    0% { --accent: #ff9f1c; } 20% { --accent: #ff5d7a; } 40% { --accent: #a06bff; }
    60% { --accent: #56a6ff; } 80% { --accent: #3ddc97; } to { --accent: #ff9f1c; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; color: var(--txt); font-family: "Segoe UI", Arial, sans-serif; overflow: hidden; }
  #wrap {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    max-height: 100vh;
    max-width: 430px;
    padding: 6px 8px 8px;
    font-size: 12px;
    line-height: 1.35;
  }
  .now {
    display: none;
    align-items: center;
    gap: 7px;
    padding: 4px 8px;
    margin-bottom: 5px;
    border-radius: 6px;
    background: rgba(10, 10, 12, 0.55);
    font-weight: 600;
    font-size: 12px;
    border: 1px solid var(--hair);
  }
  .now.paused { opacity: 0.7; }
  .now .ndot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .now.paused .ndot { background: var(--dim); }
  .now .nby { color: var(--dim); font-weight: 400; margin-left: auto; }
  .rows {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  #rowsView {
    overflow: hidden;
  }
  #rowsView.scroll #rows {
    transition: transform 1s ease-in-out;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(10, 10, 12, 0.55);
    border: 1px solid var(--hair);
    overflow: hidden;
  }
  .row .num {
    flex: none;
    width: 18px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--accent);
  }
  .row .title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .row .title > span,
  .now .ntitle > span {
    display: inline-block;
    will-change: transform;
  }
  .now .ntitle {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .row .by {
    color: var(--dim);
    font-size: 11px;
    margin-left: auto;
    white-space: nowrap;
  }
  .empty {
    padding: 8px;
    font-size: 12px;
    text-align: center;
    color: var(--dim);
    background: rgba(10, 10, 12, 0.45);
    border-radius: 6px;
  }
</style>
</head>
<body>
  <div id="wrap">
    <div class="now" id="now">
      <span class="ndot"></span>
      <span class="ntitle" id="nowTitle"></span>
      <span className="nby" id="nowBy"></span>
    </div>
    <div id="rowsView"><div class="rows" id="rows"></div></div>
  </div>
    <div class="rows" id="rows"></div>
  </div>
  <script>
    const nowEl = document.getElementById("now");
    const nowTitle = document.getElementById("nowTitle");
    const nowBy = document.getElementById("nowBy");
    const rowsEl = document.getElementById("rows");
    const rowsView = document.getElementById("rowsView");
    const THEMES = { amber: "#ff9f1c", rose: "#ff5d7a", mint: "#3ddc97", violet: "#a06bff", blue: "#56a6ff" };
    const VISIBLE = 5;
    const STEP_MS = 2500;
    const END_HOLD_MS = 1800;
    let scrollTimer = 0;
    let scrollPos = 0;
    let scrollDir = 1;

    function stopScroll() {
      if (scrollTimer) clearTimeout(scrollTimer);
      scrollTimer = 0;
      scrollPos = 0;
      scrollDir = 1;
      rowsView.classList.remove("scroll");
      rowsEl.style.transform = "";
      rowsView.style.height = "";
    }

    function startScroll() {
      const rows = rowsEl.querySelectorAll(".row");
      if (rows.length <= VISIBLE) return;
      const first = rows[0];
      const step = first.offsetHeight + 3;
      const max = rows.length - VISIBLE;
      rowsView.style.height = (first.offsetHeight * VISIBLE + 3 * (VISIBLE - 1)) + "px";
      rowsView.classList.add("scroll");
      const tick = () => {
        scrollPos += scrollDir;
        if (scrollPos >= max) {
          scrollPos = max;
          rowsEl.style.transform = "translateY(" + (-scrollPos * step) + "px)";
          scrollDir = -1;
          scrollTimer = setTimeout(tick, END_HOLD_MS);
          return;
        }
        if (scrollPos <= 0) {
          scrollPos = 0;
          rowsEl.style.transform = "";
          scrollDir = 1;
          scrollTimer = setTimeout(tick, END_HOLD_MS);
          return;
        }
        rowsEl.style.transform = "translateY(" + (-scrollPos * step) + "px)";
        scrollTimer = setTimeout(tick, STEP_MS);
      };
      scrollTimer = setTimeout(tick, STEP_MS);
    }

    // Copy of web/src/cvd.ts, keep identical (types stripped, no modules here).
    // Converts the picked accent into the nearest hue the deficiency can tell apart.
    const SIM = {
      protan: [[0.152286, 1.052583, -0.204868], [0.114503, 0.786281, 0.099216], [-0.003882, -0.048116, 1.051998]],
      deutan: [[0.367322, 0.860646, -0.227968], [0.280085, 0.672501, 0.047413], [-0.01182, 0.04294, 0.968881]],
      tritan: [[1.255528, -0.076749, -0.178779], [-0.078411, 0.930809, 0.147602], [0.004733, 0.691367, 0.3039]],
    };
    const BG_HEX = "#0a0a0c";
    const KEEP = 0.6;
    const MIN_SEEN_C = 0.07;
    const MIN_CONTRAST = 4.5;
    const MIN_PAIR_DE = 0.12;
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const s2l = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
    const l2s = (c) => (c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
    function isHex6(s) {
      return typeof s === "string" && /^#[0-9a-f]{6}$/i.test(s);
    }
    function hexToLin(h) {
      const n = parseInt(h.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => s2l(v / 255));
    }
    function linToHex(l) {
      return "#" + l.map((v) => Math.round(l2s(clamp01(v)) * 255).toString(16).padStart(2, "0")).join("");
    }
    function linToLab(rgb) {
      const r = rgb[0], g = rgb[1], b = rgb[2];
      const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
      const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
      const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
      return [
        0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
        1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
        0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s,
      ];
    }
    function labToLin(lab) {
      const L = lab[0], a = lab[1], b = lab[2];
      const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
      const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
      const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
      return [
        4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
        -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
        -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
      ];
    }
    const labToLch = (lab) => [lab[0], Math.hypot(lab[1], lab[2]), (Math.atan2(lab[2], lab[1]) * 180 / Math.PI + 360) % 360];
    const lchToLab = (lch) => [lch[0], lch[1] * Math.cos(lch[2] * Math.PI / 180), lch[1] * Math.sin(lch[2] * Math.PI / 180)];
    const inGamut = (l) => l.every((v) => v >= -1e-4 && v <= 1 + 1e-4);
    const lum = (l) => 0.2126 * clamp01(l[0]) + 0.7152 * clamp01(l[1]) + 0.0722 * clamp01(l[2]);
    function contrast(a, b) {
      const x = lum(a) + 0.05, y = lum(b) + 0.05;
      return x > y ? x / y : y / x;
    }
    function simulate(lin, mode) {
      const m = SIM[mode];
      return [0, 1, 2].map((i) => m[i][0] * lin[0] + m[i][1] * lin[1] + m[i][2] * lin[2]);
    }
    const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
    function fitChroma(L, C, h) {
      let lo = 0, hi = C, best = 0;
      for (let i = 0; i < 24; i++) {
        const mid = (lo + hi) / 2;
        if (inGamut(labToLin(lchToLab([L, mid, h])))) { best = mid; lo = mid; } else hi = mid;
      }
      return best;
    }
    function build(L, C, h) {
      const c = fitChroma(L, C, h);
      return { L, C: c, h, lin: labToLin(lchToLab([L, c, h])) };
    }
    function seenLab(c, mode) {
      return linToLab(simulate(c.lin, mode));
    }
    function isSafe(c, mode) {
      const seenC = labToLch(seenLab(c, mode))[1];
      const ratio = c.C > 1e-4 ? seenC / c.C : 1;
      return ratio >= KEEP && seenC >= Math.min(MIN_SEEN_C, c.C * KEEP);
    }
    function resolveCvd(hex, mode, avoidHex) {
      if (!isHex6(hex) || !SIM[mode]) return hex;
      const lch0 = labToLch(linToLab(hexToLin(hex)));
      const L0 = lch0[0], C0 = lch0[1], h0 = lch0[2];
      if (C0 < 0.02) return hex;
      const avoid = avoidHex && isHex6(avoidHex) ? linToLab(simulate(hexToLin(avoidHex), mode)) : null;
      let found = null;
      for (let d = 0; d <= 180 && !found; d++) {
        for (const sgn of d === 0 ? [1] : [1, -1]) {
          const c = build(L0, C0, (h0 + sgn * d + 360) % 360);
          if (!isSafe(c, mode)) continue;
          if (avoid && dist(seenLab(c, mode), avoid) < MIN_PAIR_DE) continue;
          found = c;
          break;
        }
      }
      let c = found || build(L0, C0, h0);
      const bg = hexToLin(BG_HEX);
      let L = c.L;
      while (L < 0.98 && contrast(build(L, c.C, c.h).lin, bg) < MIN_CONTRAST) L += 0.01;
      if (L !== c.L) c = build(L, c.C, c.h);
      return linToHex(c.lin);
    }

    // State-driven paint: theme and CB mode are independent inputs, the accent
    // is always derived from the picked theme color. Off restores the theme.
    let curId = "amber", curColor = null, cbMode = "off";
    function setTheme(id, color) { curId = id; curColor = color; paint(); }
    function setCb(id) { cbMode = (id === "protan" || id === "deutan" || id === "tritan") ? id : "off"; paint(); }
    function paint() {
      const root = document.documentElement;
      const old = document.getElementById("cb-rgb");
      if (old) old.remove();
      if (curId === "rgb") {
        root.classList.add("rgb");
        root.style.removeProperty("--accent");
        if (cbMode !== "off") {
          const stops = ["#ff9f1c", "#ff5d7a", "#a06bff", "#56a6ff", "#3ddc97"].map((s) => resolveCvd(s, cbMode));
          const el = document.createElement("style");
          el.id = "cb-rgb";
          el.textContent = "@keyframes accent-cycle { 0% { --accent: " + stops[0] + "; } 20% { --accent: " + stops[1] +
            "; } 40% { --accent: " + stops[2] + "; } 60% { --accent: " + stops[3] +
            "; } 80% { --accent: " + stops[4] + "; } 100% { --accent: " + stops[0] + "; } }";
          document.head.appendChild(el);
        }
        return;
      }
      root.classList.remove("rgb");
      const base = (curId === "custom" && isHex6(curColor)) ? curColor : (THEMES[curId] || "#ff9f1c");
      root.style.setProperty("--accent", cbMode === "off" ? base : resolveCvd(base, cbMode));
    }

    function render(music) {
      const q = Array.isArray(music?.queue) ? music.queue : [];

      if (music?.now) {
        nowEl.style.display = "flex";
        nowEl.classList.toggle("paused", music.playing === false);
        nowTitle.textContent = "";
        const ns = document.createElement("span");
        ns.textContent = music.now.title || "";
        nowTitle.appendChild(ns);
        nowBy.textContent = music.now.by && music.now.by !== "you" ? ("by " + music.now.by) : "";
      } else {
        nowEl.style.display = "none";
      }

      const frag = document.createDocumentFragment();
      if (q.length === 0) {
        const d = document.createElement("div");
        d.className = "empty";
        d.textContent = "queue is empty";
        frag.appendChild(d);
      } else {
        q.forEach((t, i) => {
          const r = document.createElement("div");
          r.className = "row";
          const num = document.createElement("span");
          num.className = "num";
          num.textContent = String(i + 1);
          const title = document.createElement("span");
          title.className = "title";
          title.title = t.title || "";
          const ts = document.createElement("span");
          ts.textContent = t.title || "";
          title.appendChild(ts);
          const by = document.createElement("span");
          by.className = "by";
          by.textContent = t.by && t.by !== "you" ? ("by " + t.by) : "";
          r.append(num, title, by);
          frag.appendChild(r);
        });
      }
      rowsEl.replaceChildren(frag);
      stopScroll();
      stopMarquee();
      runMarquee();
      startScroll();
    }

    let marqueeTimers = [];

    function stopMarquee() {
      marqueeTimers.forEach((t) => clearTimeout(t));
      marqueeTimers = [];
    }

    function marqueeBox(el) {
      const inner = el ? el.firstElementChild : null;
      if (!inner) return;
      inner.style.transition = "";
      inner.style.transform = "";
      const excess = inner.scrollWidth - el.clientWidth;
      if (excess <= 8) return;
      const fwd = excess / 45;
      const go = () => {
        inner.style.transition = "transform " + fwd.toFixed(2) + "s linear";
        inner.style.transform = "translateX(" + -excess + "px)";
        marqueeTimers.push(setTimeout(() => {
          inner.style.transition = "transform 1s ease-in-out";
          inner.style.transform = "";
          marqueeTimers.push(setTimeout(go, 2200));
        }, fwd * 1000 + 1800));
      };
      marqueeTimers.push(setTimeout(go, 1500));
    }

    function runMarquee() {
      if (nowEl.style.display !== "none") marqueeBox(nowTitle);
      rowsEl.querySelectorAll(".row .title").forEach(marqueeBox);
    }

    function connect() {
      let ws;
      try { ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"); }
      catch { return retry(); }
      ws.onmessage = (ev) => {
        let m;
        try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === "init") { render(m.music); setTheme(m.theme, m.themeColor); setCb(m.cbmode); }
        else if (m.type === "music") render(m.music);
        else if (m.type === "theme" && m.id) setTheme(m.id, m.color);
        else if (m.type === "cbmode") setCb(m.id);
      };
      ws.onclose = retry;
      ws.onerror = () => { try { ws.close(); } catch {} };
    }
    function retry() {
      setTimeout(connect, 2500);
    }
    connect();
  </script>
</body>
</html>
